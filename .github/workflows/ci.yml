name: CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'dooz-pm-suite/**'
      - '.github/workflows/dooz-pm-suite-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'dooz-pm-suite/**'

jobs:
  ci:
    uses: ./.github/workflows/templates/bun-ci.yml
    with:
      working-directory: dooz-pm-suite
      run-tests: true
      test-command: 'bun test || echo "No tests yet"'

  database-test:
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: dooz-pm-suite
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Setup test database
        run: |
          mkdir -p data
          touch data/test.db
      
      - name: Run database migrations
        run: bun run db:migrate || echo "No migration script"
      
      - name: Test database connection
        run: |
          echo "Testing database operations..."
          # Add specific DB tests here
